plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.4'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: '../lib', include: ['*.jar'])
}

bootJar {
    enabled = true
}

tasks.named('jar') {
    dependsOn(':Client:compileJava')
    dependsOn(':Client:processResources')
}